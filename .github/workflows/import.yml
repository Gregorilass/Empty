name: Import Ancient Warfare Project

on:
  push:
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and organize project
        run: |
          unzip -o -q ancientwarfare_26_3_github_upload.zip

          test -f build.gradle
          test -f .github/workflows/build.yml

          git rm ancientwarfare_26_3_github_upload.zip
          rm .github/workflows/import.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Import Ancient Warfare project"
          git push

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Validate resources
        run: python3 scripts/validate_stage2.py

      - name: Compile project
        run: gradle --no-daemon --stacktrace build
