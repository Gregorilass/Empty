
name: Import Ancient Warfare Stage 4

on:
  push:
    paths:
      - ".github/workflows/import.yml"
      - "AncientWarfare_Stage4_GitHub.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import Stage 4 files
        run: |
          test -f AncientWarfare_Stage4_GitHub.zip
          unzip -o -q AncientWarfare_Stage4_GitHub.zip

          test -f build.gradle
          test -f scripts/validate_stage4.py

          rm -f .github/workflows/build.yml
          git rm AncientWarfare_Stage4_GitHub.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Import Ancient Warfare Stage 4 NPCs"
          git push origin HEAD:main

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Validate Stage 4
        run: |
          python3 scripts/validate_stage3.py
          python3 scripts/validate_stage4.py

      - name: Compile Ancient Warfare
        run: gradle --no-daemon --stacktrace build

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AncientWarfare-26.3-Stage4-UNTESTED
          path: build/libs/*.jar
          if-no-files-found: error
          
