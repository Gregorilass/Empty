
name: Import Ancient Warfare Stages 5 and 6

on:
  push:
    paths:
      - ".github/workflows/import.yml"
      - "AncientWarfare_Stages_5_and_6_GitHub_Upload.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import Stages 5 and 6
        run: |
          unzip -o -q AncientWarfare_Stages_5_and_6_GitHub_Upload.zip

          test -f build.gradle
          test -f scripts/validate_stage56.py

          rm -f .github/workflows/build.yml
          git rm AncientWarfare_Stages_5_and_6_GitHub_Upload.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Import Ancient Warfare Stages 5 and 6"
          git push origin HEAD:main

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Validate project
        run: |
          python3 scripts/validate_stage3.py
          python3 scripts/validate_stage4.py

      - name: Compile Ancient Warfare
        run: gradle --no-daemon --stacktrace build

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AncientWarfare-26.3-Stage5-6-UNTESTED
          path: build/libs/*.jar
          if-no-files-found: error
          
