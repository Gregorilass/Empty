plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets.main.resources { srcDir('src/generated/resources') }
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties([
        mod_license: mod_license,
        mod_id: mod_id,
        mod_version: mod_version,
        mod_name: mod_name,
        neo_version: neo_version,
        minecraft_version_range: minecraft_version_range
    ])
    expand([
        mod_license: mod_license,
        mod_id: mod_id,
        mod_version: mod_version,
        mod_name: mod_name,
        neo_version: neo_version,
        minecraft_version_range: minecraft_version_range
    ])
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Keep the repository's established import workflow unchanged. On GitHub Actions
// the Gradle build also runs all port regression tests, including Stages 9+10.
if (System.getenv('GITHUB_ACTIONS') == 'true') {
    tasks.register('validateStage910', Exec) {
        commandLine 'python3', 'scripts/validate_stage910.py'
    }
    tasks.named('check').configure {
        dependsOn tasks.named('validateStage910')
    }
}
